<article class="post-summary">
  <h3 class="post-summary-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
  <p class="post-meta">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
    {{- with partial "byline.html" . }}
    <span class="sep" aria-hidden="true">/</span>
    {{ . }}
    {{- end }}
  </p>
  {{- with .Description }}
  <p class="post-summary-desc">{{ . }}</p>
  {{- end }}
</article>
