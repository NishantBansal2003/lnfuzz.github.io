{{ define "main" }}
<div class="wrap">
  <h1 class="page-title">{{ .Title }}</h1>
  {{- with .Content }}
  <div class="intro">{{ . }}</div>
  {{- end }}
  <div class="post-list">
    {{- range .Pages }}
    {{ partial "post-summary.html" . }}
    {{- else }}
    <p>No posts yet.</p>
    {{- end }}
  </div>
</div>
{{ end }}
